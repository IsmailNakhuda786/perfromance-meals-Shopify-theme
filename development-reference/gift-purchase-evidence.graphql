query GiftPurchaseEvidence { shop { myshopifyDomain currencyCode } orders(first:3,sortKey:CREATED_AT,reverse:true) { nodes { id name test displayFinancialStatus currencyCode totalPriceSet { shopMoney { amount currencyCode } } customer { id } lineItems(first:5) { nodes { title quantity isGiftCard } } } } giftCards(first:20) { nodes { id enabled balance { amount currencyCode } recipientAttributes { recipient { id } } order { id name test } } pageInfo { hasNextPage } } }
