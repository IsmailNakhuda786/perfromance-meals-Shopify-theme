mutation SourceProduct($product:ProductUpdateInput!){productUpdate(product:$product){product{id title status vendor requiresSellingPlan}userErrors{field message}}}
mutation SourceImageAlt($productId:ID!,$media:[UpdateMediaInput!]!){productUpdateMedia(productId:$productId,media:$media){media{id alt}mediaUserErrors{field message}}}
mutation SourcePlanLabels($id:ID!,$input:SellingPlanGroupInput!){sellingPlanGroupUpdate(id:$id,input:$input){sellingPlanGroup{id name sellingPlans(first:10){nodes{id name options}}}userErrors{field message}}}
