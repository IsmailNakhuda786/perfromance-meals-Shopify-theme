# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0376ed0b829d3b3eadb19f2476d0f450"
application_url = "https://example.com"
embedded = true
name = "Performance Meals Core"

[webhooks]
api_version = "2026-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,read_metaobjects,write_metaobjects,read_metaobject_definitions,read_orders,write_orders,read_products,write_app_proxy,write_products,read_own_subscription_contracts,write_own_subscription_contracts,read_gift_cards,write_gift_cards,write_gift_card_transactions,read_store_credit_accounts,write_store_credit_account_transactions,read_draft_orders,write_draft_orders"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[app_proxy]
url = "/proxy"
subpath = "performance-meals"
prefix = "apps"
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"
[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/privacy"

[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "/webhooks/orders/create"
