api_version = "2026-07"

[[extensions]]
name = "t:name"
handle = "core-bundle-signin-qa"
uid = "e7cab9fd-163c-005a-00de-18afa11c38a304aca4a2"
type = "function"
description = "t:description"

  [[extensions.targeting]]
